<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人知识库助手</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f5f6f8;
      color: #1f2328;
      display: flex;
      justify-content: center;
      height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 820px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.06);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid #e5e7eb;
    }

    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    header p {
      margin: 2px 0 0;
      font-size: 12px;
      color: #6b7280;
    }

    #new-session {
      border: 1px solid #d1d5db;
      background: #fff;
      color: #374151;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    #new-session:hover { background: #f3f4f6; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .session-meta {
      padding: 6px 10px;
      border-radius: 8px;
      background: #f3f4f6;
      color: #4b5563;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      cursor: help;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.assistant {
      align-self: flex-start;
      background: #f3f4f6;
      border-bottom-left-radius: 4px;
    }

    .msg.assistant.error {
      background: #fef2f2;
      color: #b91c1c;
    }

    .sources {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed #d1d5db;
      font-size: 12px;
      color: #6b7280;
    }

    .sources-label {
      margin-bottom: 6px;
      font-weight: 600;
      color: #4b5563;
    }

    .source {
      margin-bottom: 6px;
      padding-left: 8px;
      border-left: 2px solid #cbd5e1;
    }

    .source-title {
      color: #374151;
      font-weight: 500;
    }

    .source-snippet {
      margin-top: 2px;
      color: #6b7280;
    }

    .composer {
      display: flex;
      gap: 10px;
      padding: 14px 20px 18px;
      border-top: 1px solid #e5e7eb;
      background: #fff;
    }

    #input {
      flex: 1;
      resize: none;
      height: 48px;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font: inherit;
      font-size: 14px;
      outline: none;
    }

    #input:focus { border-color: #2563eb; }

    #send {
      width: 80px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    #send:hover { background: #1d4ed8; }

    #send:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    .hint {
      padding: 0 20px 10px;
      font-size: 12px;
      color: #9ca3af;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>个人知识库助手</h1>
        <p>Chroma 检索 + DeepSeek 生成</p>
      </div>
      <div class="header-right">
        <div class="session-meta" id="session-meta">会话 - · 0 轮</div>
        <button id="new-session" type="button">新会话</button>
      </div>
    </header>

    <div id="messages"></div>

    <div class="composer">
      <textarea id="input" placeholder="问点什么…"></textarea>
      <button id="send" type="button">发送</button>
    </div>
    <div class="hint">Enter 发送，Shift + Enter 换行</div>
  </div>

  <script>
    // 会话 ID：存在 localStorage 里，刷新页面也能接着上一轮聊
    const SESSION_KEY = "rag_session_id";

    function newSessionId() {
      // crypto.randomUUID 只在安全上下文可用（localhost / 127.0.0.1 也算）
      if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      return "sess-" + Date.now() + "-" + Math.random().toString(16).slice(2);
    }

    let sessionId = localStorage.getItem(SESSION_KEY);
    if (!sessionId) {
      sessionId = newSessionId();
      localStorage.setItem(SESSION_KEY, sessionId);
    }

    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const newSessionBtn = document.getElementById("new-session");
    const sessionMetaEl = document.getElementById("session-meta");

    let sending = false;
    // 服务端记录的本会话轮数；页面加载时会从 /sessions/{id} 拉一次
    let rounds = 0;

    function renderSessionMeta() {
      // 只显示前 8 位，鼠标悬停可看完整 ID
      sessionMetaEl.textContent = "会话 " + sessionId.slice(0, 8) + " · " + rounds + " 轮";
      sessionMetaEl.title = "完整 session_id：" + sessionId;
    }

    async function refreshSessionInfo() {
      try {
        const res = await fetch("/sessions/" + encodeURIComponent(sessionId));
        if (!res.ok) return;
        const data = await res.json();
        rounds = data.rounds;
      } catch (err) {
        // 拿不到就沿用本地计数，不影响聊天
      }
      renderSessionMeta();
    }

    // 防止把模型返回的内容当成 HTML 执行
    function esc(text) {
      const div = document.createElement("div");
      div.textContent = text ?? "";
      return div.innerHTML;
    }

    function addMessage(role, content, sources) {
      const el = document.createElement("div");
      el.className = "msg " + role;

      let html = esc(content);

      if (sources && sources.length) {
        html += '<div class="sources"><div class="sources-label">来源</div>';
        for (const s of sources) {
          html +=
            '<div class="source">' +
              '<div class="source-title">' + esc(s.title) + "</div>" +
              '<div class="source-snippet">' + esc(s.snippet) + "</div>" +
            "</div>";
        }
        html += "</div>";
      }

      el.innerHTML = html;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    function addWelcome() {
      addMessage(
        "assistant",
        "你好，我可以基于你的笔记回答问题。也可以直接问知识库外的内容，我会用通用知识回答。"
      );
    }

    function setSending(value) {
      sending = value;
      sendBtn.disabled = value;
      sendBtn.textContent = value ? "思考中" : "发送";
    }

    async function send() {
      const question = inputEl.value.trim();
      if (!question || sending) return;

      addMessage("user", question);
      inputEl.value = "";
      inputEl.focus();
      setSending(true);

      // 先放一个占位气泡，避免等待时界面没反应
      const pending = addMessage("assistant", "…");

      try {
        // 用相对路径，保证和页面同源（同协议 / 同主机 / 同端口），不需要 CORS
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question: question,
            session_id: sessionId,
            top_k: 2,
          }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || ("HTTP " + res.status));
        }

        pending.remove();
        addMessage("assistant", data.answer, data.sources);
        // 用服务端的真实历史条数更新角标
        await refreshSessionInfo();
      } catch (err) {
        pending.remove();
        const el = addMessage("assistant", "请求失败：" + err.message);
        el.classList.add("error");
      } finally {
        setSending(false);
      }
    }

    async function startNewSession() {
      if (sending) return;

      // 顺手清掉服务端的历史；失败也不影响前端换新 ID
      try {
        await fetch("/sessions/" + encodeURIComponent(sessionId), {
          method: "DELETE",
        });
      } catch (err) {
        // 忽略：服务端没清掉也只是留一段没人用的历史
      }

      sessionId = newSessionId();
      localStorage.setItem(SESSION_KEY, sessionId);

      rounds = 0;
      renderSessionMeta();

      messagesEl.innerHTML = "";
    addWelcome();
    renderSessionMeta();
    // 刷新页面后从服务端核对：这个会话是不是还在、已经聊了几轮
    refreshSessionInfo();
      inputEl.focus();
    }

    sendBtn.addEventListener("click", send);

    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        send();
      }
    });

    newSessionBtn.addEventListener("click", startNewSession);

    addWelcome();
  </script>
</body>
</html>
